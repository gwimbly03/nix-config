
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$nix_shell\
$character"""

add_newline = true

[username]
style_user = "bright-purple"
style_root = "red"
format = "[󰀉 $user]($style) "
show_always = false

[hostname]
ssh_only = true
format = "[󰒋 $hostname](bright-black) "

[directory]
style = "blue"
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = "󰇚"
"Music" = "󰝚"
"Pictures" = "󰋩"
"Videos" = "󰕧"
".nix-config" = "󱄅"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bright-black"

[git_state]
symbol = "󰊢 "
format = '[$symbol$state( $progress_current/$progress_total)]($style) '
style = "bright-black"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "cyan"
conflicted = "󰞇 "
untracked = "󰋗 "
modified = "󰏫 "
staged = "󰐗 "
renamed = "󰑕 "
deleted = "󰍴 "
stashed = "󰆼 "
ahead = "󰁝${count}"
behind = "󰁅${count}"
diverged = "󰹹⇡${ahead_count}⇣${behind_count}"
up_to_date = ""

[cmd_duration]
min_time = 2_000
format = "[󱎫 $duration]($style) "
style = "yellow"
show_milliseconds = false

[python]
symbol = "󰌠 "
format = '[$symbol$virtualenv]($style) '
style = "bright-black"
detect_extensions = []
detect_files = []
detect_folders = [".venv", "venv"]

[nix_shell]
symbol = "󱄅 "
format = '[$symbol$name]($style) '
style = "blue"

